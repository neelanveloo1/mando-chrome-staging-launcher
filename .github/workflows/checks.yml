name: Verify launcher and dashboard
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: bash tests/test-package.sh
      - run: npm run build
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: work/Mando-Chrome-Team-Installer.zip

  # A v<version> tag publishes the installer that the test job just built and
  # verified on macOS, under the asset name the README's download link expects.
  # The tag has to match package.json, so a stale version can't ship by accident.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: work
      - name: Publish release
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(node -p "require('./package.json').version")
          [ "$tag" = "v$version" ] || { echo "::error::Tag $tag does not match package.json version $version"; exit 1; }
          unzip -tq work/Mando-Chrome-Team-Installer.zip
          notes=$(mktemp)
          {
            echo "## Mando Chrome $version"
            echo
            echo "Download **Mando-Chrome-Team-Installer.zip**, unzip it, double-click **Install Mando Chrome.command**, quit Chrome with ⌘Q, then open Mando Chrome once."
            echo
            echo "What changed: see \`BUILD_INFO.json\` in the installer and the commits since the previous tag."
          } > "$notes"
          # A release made on github.com for this tag (which is what creates the tag
          # when nobody pushes one) gets the installer attached; otherwise one is created.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber work/Mando-Chrome-Team-Installer.zip
            gh release edit "$tag" --latest
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Mando Chrome $version" \
              --notes-file "$notes" --latest work/Mando-Chrome-Team-Installer.zip
          fi
