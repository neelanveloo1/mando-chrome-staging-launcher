name: Verify launcher and dashboard
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash tests/test-package.sh
      - run: npm run build
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: work/Mando-Chrome-Team-Installer.zip
